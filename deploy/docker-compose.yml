services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - math-games
    networks:
      - web

  math-games:
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/math-games:${TAG:-latest}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
    driver: bridge
