name: TanStack Start Cloudflare

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Alchemy action to run against the dev Cloudflare stack'
        required: true
        default: 'plan'
        type: choice
        options:
          - bootstrap
          - plan
          - deploy
      remote_url:
        description: 'Optional HTTPS deployed Worker origin for post-deploy smoke. Must not include path/query/fragment, localhost, private-network, or a non-default port. Leave blank to resolve workers.dev.'
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: 'start-cloudflare-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    environment: cloudflare-dev
    env:
      CI: 'true'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install standalone Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run guarded Alchemy action
        run: |
          if [ "${{ inputs.action }}" = "bootstrap" ]; then
            pnpm check
            pnpm infra:bootstrap
            pnpm infra:check
          elif [ "${{ inputs.action }}" = "deploy" ]; then
            pnpm deploy
          else
            pnpm infra:plan
          fi

      - name: Remote smoke
        if: ${{ inputs.action == 'deploy' }}
        env:
          START_REMOTE_URL: ${{ inputs.remote_url }}
        run: pnpm infra:check && pnpm smoke:remote
