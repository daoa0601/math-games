<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Vibrant Solid Gradients -->
    <linearGradient id="gradSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/> <!-- Green-400 -->
      <stop offset="100%" style="stop-color:#16a34a"/> <!-- Green-600 -->
    </linearGradient>
    <linearGradient id="gradCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/> <!-- Blue-400 -->
      <stop offset="100%" style="stop-color:#2563eb"/> <!-- Blue-600 -->
    </linearGradient>
    <linearGradient id="gradTriangle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/> <!-- Amber-400 -->
      <stop offset="100%" style="stop-color:#d97706"/> <!-- Amber-600 -->
    </linearGradient>
  </defs>

  <!-- Background: Gentle rounded square to unify -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- SHAPE 1: Top Center - SQUARE (Shape Architect) -->
  <!-- Represents building blocks and geometry -->
  <g transform="translate(32, 20)">
    <rect x="-10" y="-10" width="20" height="20" rx="3" fill="url(#gradSquare)" stroke="#166534" stroke-width="1.5"/>
    <!-- Internal detail: simple grid lines -->
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#166534" stroke-width="1" opacity="0.5"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#166534" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- SHAPE 2: Bottom Left - CIRCLE (Magic Graph) -->
  <!-- Represents graph nodes and unity -->
  <g transform="translate(18, 44)">
    <circle cx="0" cy="0" r="11" fill="url(#gradCircle)" stroke="#1e40af" stroke-width="1.5"/>
    <!-- Internal detail: connected nodes -->
    <circle cx="-3" cy="3" r="2" fill="white"/>
    <circle cx="3" cy="-3" r="2" fill="white"/>
    <line x1="-3" y1="3" x2="3" y2="-3" stroke="white" stroke-width="1.5"/>
  </g>

  <!-- SHAPE 3: Bottom Right - TRIANGLE (Sequence Race) -->
  <!-- Represents delta, change, upward growth -->
  <g transform="translate(46, 44)">
    <path d="M0,-11 L11,9 L-11,9 Z" fill="url(#gradTriangle)" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Internal detail: ascending bars -->
    <rect x="-4" y="2" width="2" height="4" fill="white"/>
    <rect x="-1" y="-2" width="2" height="8" fill="white"/>
    <rect x="2" y="-6" width="2" height="12" fill="white"/>
  </g>

</svg>
